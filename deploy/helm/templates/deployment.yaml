apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inferav22.fullname" . }}
  labels:
    {{- include "inferav22.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inferav22.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inferav22.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "inferav22.fullname" .) }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "inferav22.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.secretName }}
                optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- include "inferav22.nodeSelector" . | nindent 8 }}
